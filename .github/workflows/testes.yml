# Roda todos os testes (Vitest, Playwright e os testes da conta Google com os emuladores do Firebase) em pull requests.
name: Testes

on:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
      # Conta Google (Firebase): roda com os emuladores do Firebase (precisam de Java, que já vem no Ubuntu do GitHub).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:e2e:firebase
        env:
          CI: '1'
